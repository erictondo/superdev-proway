<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tabela</title>
</head>

<body>
    <table border="2">
        <thead>
            <!--thead é o cabeçalho-->
            <!--somente um TR (table roll=uma linha de cabeçalho)-->
            <tr>
                <th>Jogo</th>
                <th>Nota</th>
            </tr>
        </thead>

        <tbody>
            <tr>
            <!--td é table data-->
                <td>Hades</td>
                <td>9,0</td>
            </tr>

            <tr>
                <td>Hell Is Us</td>
                <td>8,0</td>
            </tr>
        </tbody>

        <tfoot>
            <!--tfoot é rodapé-->
            <tr>
                <td>Média</td>
                <td>8,5</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
